# Planet-M Shop API gateway. Flow: browser -> Next.js BFF -> nginx -> Spring Boot (not published).
# Dev config: Swagger paths are open. In production remove the swagger/api-docs location and add TLS.
worker_processes auto;
events { worker_connections 1024; }

http {
    # The BFF forwards the shopper's IP in X-Forwarded-For. Trust that header only when the request
    # comes from a trusted address (the BFF), listed in trusted-proxies.conf, so rate limits apply
    # per shopper, not per BFF. Never trust whole private ranges in production.
    include /etc/nginx/trusted-proxies.conf;   # dev: Docker Desktop gateway only; prod: the BFF's real address(es)
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Rate-limit zones (keys are the real client IP). Starting values; tune after load testing.
    limit_req_zone $binary_remote_addr zone=api:10m      rate=10r/s;
    limit_req_zone $binary_remote_addr zone=cart:10m     rate=5r/s;
    limit_req_zone $binary_remote_addr zone=checkout:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m  rate=20r/s;
    limit_req_status 429;

    # Reuse the caller's X-Request-Id when present, otherwise generate one.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream spring_backend {
        # Spring runs on the host via ./mvnw spring-boot:run (port 8081).
        # When the backend runs as a container, change to: server backend:8081;
        server host.docker.internal:8081;
    }

    server {
        listen 80;
        client_max_body_size 1m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id      $req_id;
        add_header       X-Request-Id      $req_id always;

        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"title":"Too Many Requests","status":429}';
        }

        # Internal endpoints are never reachable through the gateway.
        location /actuator/ { return 404; }

        # Dev only (remove in production).
        location ~ ^/(swagger-ui|v3/api-docs) { proxy_pass http://spring_backend; }

        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://spring_backend;
        }
        location /api/v1/cart {
            limit_req zone=cart burst=10 nodelay;
            proxy_pass http://spring_backend;
        }
        location ~ ^/api/v1/(orders/checkout|payments/) {
            limit_req zone=checkout burst=5 nodelay;
            proxy_pass http://spring_backend;
        }
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://spring_backend;
        }
        # Stripe retries failed deliveries; signature is verified inside Spring.
        location = /webhooks/stripe {
            limit_req zone=webhook burst=40 nodelay;
            proxy_pass http://spring_backend;
        }

        location / { return 404; }
    }
}
