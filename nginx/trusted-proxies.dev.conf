# DEV ONLY. The BFF runs on the host; Docker Desktop shows its requests to nginx as coming from the
# gateway of the compose network, observed as 172.18.0.1. Only this single address is trusted for
# X-Forwarded-For. If your machine uses a different address, find it with:
#   docker network inspect planet-m-shop-backend_default --format '{{(index .IPAM.Config 0).Gateway}}'
set_real_ip_from 172.18.0.1;
