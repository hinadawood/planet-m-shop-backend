services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: planetm
      POSTGRES_USER: planetm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports: ["5432:5432"]          # dev only
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]          # dev only
  cassandra:
    image: cassandra:5
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports: ["9042:9042"]          # dev only
    volumes: [cassandradata:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
  cassandra-init:
    image: cassandra:5
    depends_on:
      cassandra: { condition: service_healthy }
    volumes: ["./db/cassandra/schema.cql:/schema.cql:ro"]
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"
  nginx:
    image: nginx:1.27
    ports: ["8080:80"]            # the only way in to the API
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/trusted-proxies.dev.conf:/etc/nginx/trusted-proxies.conf:ro"   # production: mount trusted-proxies.prod.conf (copied from the .example) instead
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  pgdata:
  cassandradata:
