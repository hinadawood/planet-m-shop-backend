services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: planetm
      POSTGRES_USER: planetm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
